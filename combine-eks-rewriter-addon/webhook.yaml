# MutatingWebhookConfiguration for combine-eks-rewriter.
#
# Kept separate from deploy.yaml so that re-applying the Deployment/Service never resets the
# caBundle. Apply this ONCE, then run gen-certs.sh (which injects the caBundle into the live
# object). If you re-apply THIS file, you must re-run gen-certs.sh afterward.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: combine-eks-rewriter
webhooks:
  - name: rewrite.eks-addon-registry.combine
    admissionReviewVersions: ["v1"]
    sideEffects: None
    # NEVER block pod creation. If the webhook is unreachable, pods are admitted unmutated — i.e.
    # the no-webhook behavior. It can only fix pulls, never break them.
    failurePolicy: Ignore
    reinvocationPolicy: IfNeeded
    timeoutSeconds: 5
    clientConfig:
      service:
        name: combine-eks-rewriter
        namespace: combine-system
        path: /mutate
        port: 443
      caBundle: ""   # injected by gen-certs.sh — leave empty here
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    # Watch ALL namespaces except our own. The rewrite is self-limiting — it only touches images
    # matching the commercial EKS add-on ECR pattern (+ the account allow list); every other image
    # passes through untouched. This is the robust default because AWS-managed add-ons deploy to
    # several namespaces (kube-system, amazon-guardduty, amazon-cloudwatch, …) and a fixed list will
    # silently miss any you didn't enumerate (and any AWS adds later). failurePolicy: Ignore keeps a
    # cluster-wide scope safe — a webhook outage never blocks pod creation.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["combine-system"]   # never mutate our own namespace
    #
    # --- Alternative: tighter scope to specific add-on namespaces (smaller admission footprint) ---
    # Trade-off: you must keep this list in sync with where add-ons actually deploy, or they get
    # missed (this is exactly how aws-guardduty-agent, which lives in amazon-guardduty, slipped past
    # a kube-system-only scope). Prefer the all-namespaces form above unless you have a reason not to.
    #
    # namespaceSelector:
    #   matchExpressions:
    #     - key: kubernetes.io/metadata.name
    #       operator: In
    #       values: ["kube-system", "amazon-guardduty", "amazon-cloudwatch"]
